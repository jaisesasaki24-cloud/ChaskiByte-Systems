server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://pagatu-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: chaskipc-logs
    static_configs:
      - targets: [localhost]
        labels:
          application: chaskipc-hardware-ms
          __path__: /var/log/chaskipc/*.log
